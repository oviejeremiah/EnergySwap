databases:
  - name: energyswap-postgres
    databaseName: energyswap
    user: energyswap
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16
    # Internal only. Omitting this makes Render accept connections from any IP
    # for a newly created database, so a leaked DATABASE_URL — in a log, a crash
    # dump, an env dump — would hand an attacker direct internet access to the
    # whole ledger, bypassing the API and every check in it. The web service
    # reaches Postgres over Render's private network, so nothing breaks.
    ipAllowList: []

services:
  - type: web
    name: energyswap-api
    runtime: node
    rootDir: EnergySwapBackend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/ready
    plan: starter
    region: oregon
    # Do not ship on a bare commit. backend-ci.yml runs the test suite, but
    # without this a commit that fails `npm test` still deploys to the live API.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: HEDERA_NETWORK
        value: testnet
      - key: DATABASE_URL
        fromDatabase:
          name: energyswap-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      # Left unset, so requireWalletSignature is false and offer posting is
      # UNAUTHENTICATED: anyone can post an offer claiming any Hedera account
      # as prosumerId. That gap is real and still open.
      #
      # It cannot be closed by setting this to "true" yet. The API already
      # enforces the signature, but the frontend has no challenge flow at all -
      # post-offer sends only prosumerId, energyAmountKWh and hbarPerKWh, with
      # no challengeNo or signature. Flipping this flag today would reject
      # every offer from every user. The client flow has to be implemented
      # first. Tracked in docs/REVIEW_LOG.md.
      - key: REQUIRE_WALLET_SIGNATURE
        sync: false
      - key: HCS_TOPIC_ID
        sync: false
      - key: ENERGY_TOKEN_ID
        sync: false
      - key: METER_ORACLE_PUBLIC_KEY
        sync: false
