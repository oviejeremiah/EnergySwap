databases:
  - name: energyswap-postgres
    databaseName: energyswap
    user: energyswap
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16
    # Internal only. Omitting this makes Render accept connections from any IP
    # for a newly created database, so a leaked DATABASE_URL — in a log, a crash
    # dump, an env dump — would hand an attacker direct internet access to the
    # whole ledger, bypassing the API and every check in it. The web service
    # reaches Postgres over Render's private network, so nothing breaks.
    ipAllowList: []

services:
  - type: web
    name: energyswap-api
    runtime: node
    rootDir: EnergySwapBackend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/ready
    plan: starter
    region: oregon
    # Do not ship on a bare commit. backend-ci.yml runs the test suite, but
    # without this a commit that fails `npm test` still deploys to the live API.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: HEDERA_NETWORK
        value: testnet
      - key: DATABASE_URL
        fromDatabase:
          name: energyswap-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      # Offer posting requires proof that the caller controls the Hedera account it
      # claims as the producer. This closes an impersonation gap: without it,
      # anyone could post an offer naming any account as the seller.
      #
      # Enabled now because the client half exists. src/wallet-signature.js
      # requests a challenge from the API and has the Hedera wallet sign it via
      # HIP-32 signer.sign() - the same signer that already signs the HBAR
      # transfer - so no private key is ever handled in the page.
      #
      # A user whose wallet cannot sign HIP-32 messages will be unable to post
      # an offer. That is the intended trade-off: refusing those posts is
      # correct, accepting them unauthenticated is not.
      - key: REQUIRE_WALLET_SIGNATURE
        value: "true"
      - key: HCS_TOPIC_ID
        sync: false
      - key: ENERGY_TOKEN_ID
        sync: false
      - key: METER_ORACLE_PUBLIC_KEY
        sync: false
